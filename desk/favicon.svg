<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Cultural Beta">
  <!-- paper tile with the desk's hairline: the mark sits on the site's own page colour -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="#f4efe3" stroke="#d9d0bd" stroke-width="16"/>
  <!-- market line: straight, the index, in ink -->
  <path d="M104 376 L408 152" stroke="#1c1710" stroke-width="40" stroke-linecap="round" fill="none"/>
  <!-- taste line: the audience, moving, in the desk accent -->
  <path d="M104 316 C150 170 226 452 256 264 C286 76 362 358 408 212" stroke="#7f2d22" stroke-width="40" stroke-linecap="round" fill="none"/>
  <!-- the stamp dot: where taste meets market, re-checked -->
  <circle cx="256" cy="264" r="36" fill="#f4efe3" stroke="#1c1710" stroke-width="16"/>
</svg>
